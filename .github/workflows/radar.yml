name: Research Radar

on:
  # Weekly analysis + collection (Monday 08:00 UTC)
  schedule:
    - cron: "0 8 * * 1"
  # Daily collection only (Tue–Sun 08:00 UTC)
  # Uncomment to enable daily collection:
  # schedule:
  #   - cron: "0 8 * * 2-7"
  # Manual trigger with optional mode override
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "full"
        type: choice
        options:
          - full           # collect + analyze
          - collect-only   # collect and triage only
          - analyze-only   # analyze from existing pool
          - force          # force analysis even if not due

# Allow the workflow to commit state and digests back to the repo
permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Research Radar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # SMTP alternative (set email.provider=smtp in config.yaml)
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          MODE="${{ github.event.inputs.mode || 'full' }}"
          mkdir -p logs state/candidates digests
          case "$MODE" in
            collect-only)  python scripts/run.py --collect-only ;;
            analyze-only)  python scripts/run.py --analyze-only ;;
            force)         python scripts/run.py --force ;;
            *)             python scripts/run.py ;;
          esac

      - name: Commit state and digests
        run: |
          git config user.name  "research-radar-bot"
          git config user.email "research-radar-bot@users.noreply.github.com"
          git add state/seen_urls.json state/known_gaps.json digests/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update state and digests [$(date -u +%Y-%m-%d)]

            Co-Authored-By: Research Radar Bot <research-radar-bot@users.noreply.github.com>"
            git push
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-logs-${{ github.run_id }}
          path: logs/run.log
          retention-days: 14
